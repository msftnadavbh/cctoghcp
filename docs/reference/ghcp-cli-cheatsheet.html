html{scroll-padding-top:env(safe-area-inset-top,0px)}

.w{max-width:860px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:4px 0}
.sub{color:var(--mu);font-size:13px;margin-bottom:12px}
input{width:100%;box-sizing:border-box;padding:12px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:16px}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:10px 0}
.tabs button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 12px;border-radius:999px;font-size:14px;cursor:pointer}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px}
code{direction:ltr;unicode-bidi:isolate;background:var(--cd);padding:3px 8px;border-radius:6px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;white-space:nowrap;cursor:pointer;color:var(--ac)}
.d{flex:1;font-size:14px}
.new{font-size:11px;background:var(--ac);color:#fff;border-radius:6px;padding:1px 6px;margin-inline-start:6px}
.bar{display:flex;gap:8px;margin:12px 0}
.bar button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);font-size:14px;cursor:pointer}
.exp{background:#c77a00}
.lang{display:flex;gap:6px;justify-content:flex-end}.lang button{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:5px 12px;border-radius:8px;cursor:pointer;font-size:13px}.lang button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.ft{color:var(--mu);font-size:12px;margin-top:16px}
a{color:var(--ac)}
</style>
